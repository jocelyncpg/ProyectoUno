<ion-content [fullscreen]="true">
  <h2>Crear Asignatura</h2>

  <form (ngSubmit)="addAsignatura()">
    <ion-item>
      <ion-label position="floating">Nombre Asignatura</ion-label>
      <br>
      <ion-input name="nombre" placeholder="Escriba aquí" [(ngModel)]="asignatura.nombre" required></ion-input>
    </ion-item>

    <ion-button type="submit" expand="full" color="purple">Subir</ion-button>
  </form>
  
  <ion-button expand="full" color="purple" routerLink="/homeProfe">Volver</ion-button>
</ion-content>

<ion-footer>
  <div class="uni">
    <img src="\assets\logo-duoc.png" alt="Duoc Logo" class="university-logo" />
  </div>
</ion-footer>
